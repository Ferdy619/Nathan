<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Marketplace</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;

            /* BACKGROUND FOTO BATIK */
            background:
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('batik.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .container{
            text-align:center;

            /* transparan */
            background: rgba(255,255,255,0.15);

            padding:50px;
            border-radius:20px;

            /* efek kaca */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border:1px solid rgba(255,255,255,0.3);

            box-shadow:0 10px 25px rgba(0,0,0,0.3);

            width:90%;
            max-width:600px;

            animation: fadeIn 1s ease;
        }

        .container h1{
            color:white;
        }

        .container p{
            color:#f1f1f1;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            background:#8b4513;
            color:white;
            text-decoration:none;
            border-radius:50px;
            font-size:18px;
            transition:0.3s;
        }

        .btn:hover{
            background:#5c3310;
            transform:scale(1.05);
        }

        .hero-img{
            width:180px;
            margin-bottom:25px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        footer{
            position:absolute;
            bottom:15px;
            color:white;
            font-size:14px;
        }
    </style>
</head>
<body>

    <div class="container">

        <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
             class="hero-img">

        <h1>Nathan Marketplace</h1>

        <p>
            Selamat datang di marketplace Nathan dengan nuansa kalcerrr abiezz.
        </p>

        <p>
            Pelanggan puas kami puas, pelanggan merah kami lebih marah.

        </p>

        <p>
            #andasegankamisegan
        </p>

        <a href="index.html" class="btn">
            Masuk ke Marketplace
        </a>

    </div>

    <footer>
        © 2026 Nathan Marketplace
    </footer>

</body>
</html>
